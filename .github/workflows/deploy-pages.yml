name: Deploy old-domain redirect stubs

# 此分支的內容是給舊網域 phonixying.github.io/PetLoss/ 用的跳轉頁。
# GitHub Pages 目前設為「GitHub Actions」建置模式，必須由工作流發佈，
# 單純 push 分支不會自動建置。

on:
  push:
    branches:
      - githubpage
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
